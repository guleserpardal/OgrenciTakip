<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Elis ve Lila Ders</title><style>body{font:16px system-ui;background:#faf7ff;color:#342943;margin:0;padding:18px}h1{font-size:25px}.panel{background:white;padding:16px;border-radius:16px;margin:12px 0;box-shadow:0 2px 10px #ddd}button,select,input{padding:10px;border:1px solid #d4c4e5;border-radius:9px;background:white;margin:3px}button.active{background:#e6d5ff}.task{border-bottom:1px solid #eee;padding:12px 0}small{color:#746c7b}label{display:block;margin:8px 0}.done{opacity:.6;text-decoration:line-through}</style></head><body><h1>🌼 Elis & Lila Ders Planı</h1><p>Tek program, iki ayrı ilerleme takibi.</p><div class="panel"><button id="elis" onclick="child='Elis';render()">Elis</button><button id="lila" onclick="child='Lila';render()">Lila</button><select id="day" onchange="render()"></select><button onclick="add()">+ Ders ekle</button></div><div class="panel" id="tasks"></div><p><small>Alarmların çalışması için Android alarm iznini verin. Derslik çalışmaları okulun sitesinden açılır.</small></p><script>
const names=['Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi','Pazar'];let child='Elis';const defaults=[
[['09:30','Türkçe','Konu anlatımı','Yeni ses/kelime çalışması',25],['10:10','Matematik','Konu anlatımı','Sayılar ve işlemler',25],['11:00','Kitap','Kitap okuma','15 dakika birlikte okuma',15],['17:00','Piyano','Tekrar','Parmak egzersizi ve kısa parça',15]],
[['09:30','Türkçe','Ödev','Derslik sitesindeki Türkçe ödevi',25],['10:10','Matematik','Problem','Günlük yaşam problemleri',25],['11:00','İngilizce','Oyun','Kelimeler ve konuşma',20]],
[['09:30','Türkçe','Okuma','Okuduğunu anlama',30],['10:15','Matematik','Konu anlatımı','Yeni kazanım',25],['17:00','Piyano','Tekrar','Öğrenilen parçayı çalma',15]],
[['09:30','Matematik','Ödev','Derslik sitesindeki matematik ödevi',25],['10:15','Türkçe','Yazma','Dikte ve cümle kurma',25],['11:00','İngilizce','Tekrar','Kelime kartları',20]],
[['09:30','Türkçe','Tekrar','Haftalık okuma-yazma tekrarı',25],['10:15','Matematik','Oyun','Sayı ve işlem oyunları',25],['11:00','Kitap','Okuma','Seçtiğin hikâyeyi oku',20],['17:00','Piyano','Tekrar','Haftalık piyano tekrarı',15]],
[['13:00','İngilizce','Ders','İngilizce dersi',60],['17:00','Kitap','Okuma','Serbest okuma',15]],
[['13:00','İngilizce','Ders','İngilizce dersi',60],['15:30','Piyano','Ders','Saatini haftalık değiştir',45]]
];const key='elis_lila_shared_v2';let state=JSON.parse(localStorage.getItem(key)||'null')||{week:defaults.map(a=>a.map((x)=>({id:Math.random().toString(36).slice(2),time:x[0],subject:x[1],type:x[2],note:x[3],minutes:x[4],alarm:true}))),done:{Elis:{},Lila:{}}};let day=document.getElementById('day');names.forEach((n,i)=>day.add(new Option(n,i)));day.value=(new Date().getDay()+6)%7;
function save(){localStorage.setItem(key,JSON.stringify(state));if(window.NativeAlarm)NativeAlarm.sync(JSON.stringify({Elis:state.week}));}
function render(){document.getElementById('elis').className=child==='Elis'?'active':'';document.getElementById('lila').className=child==='Lila'?'active':'';let d=+day.value;document.getElementById('tasks').innerHTML='<h2>'+names[d]+' · '+child+'</h2>'+state.week[d].map((t,i)=>'<div class="task '+(state.done[child][t.id]?'done':'')+'"><label><input type="checkbox" '+(state.done[child][t.id]?'checked':'')+' onchange="toggle('+i+',this.checked)"> <b>'+t.time+' · '+t.subject+'</b> ('+t.minutes+' dk)</label><div>'+t.type+' · '+t.note+'</div><small>'+(t.alarm?'🔔 Alarm açık':'🔕 Alarm kapalı')+'</small><div><button onclick="edit('+i+')">Düzenle</button><button onclick="remove('+i+')">Sil</button></div></div>').join('');}
function toggle(i,v){state.done[child][state.week[+day.value][i].id]=v;save();render()}
function edit(i){let t=state.week[+day.value][i];for(let [key,label] of [['time','Saat (SS:DD)'],['subject','Ders'],['type','Çalışma türü'],['note','Ne yapılacak?'],['minutes','Dakika']]){let v=prompt(label,t[key]);if(v===null)return;t[key]=key==='minutes'?Number(v):v;}t.alarm=confirm('Bu ders için gerçek alarm çalsın mı?');save();render()}
function add(){let t={id:Math.random().toString(36).slice(2),time:'12:00',subject:'Yeni ders',type:'Ödev',note:'Çalışma açıklaması',minutes:20,alarm:true};state.week[+day.value].push(t);edit(state.week[+day.value].length-1)}
function remove(i){if(confirm('Ders silinsin mi?')){state.week[+day.value].splice(i,1);save();render()}}
save();render();
</script></body></html>
