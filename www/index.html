<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ff78ad" />
  <meta name="format-detection" content="telephone=no" />
  <title>Evde Eğitim Takip</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2714%27 fill=%27%23ff78ad%27/%3E%3Ctext x=%2732%27 y=%2745%27 font-size=%2734%27 text-anchor=%27middle%27%3E%F0%9F%8C%88%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>

<!-- ------------------------------------------------ ilk acilis / onboarding -->
<div id="onboarding" class="onboarding" hidden></div>

<!-- --------------------------------------------------------- uygulama kabugu -->
<div id="app" class="app" hidden>
  <header class="topbar">
    <div class="topbar-main">
      <button id="profileChip" class="profile-chip" type="button" aria-label="Profil seç">
        <span class="chip-avatar" id="chipAvatar">🌸</span>
        <span class="chip-text">
          <span class="chip-name" id="chipName">—</span>
          <span class="chip-sub" id="chipSub">profil değiştir</span>
        </span>
        <span class="chip-caret">▾</span>
      </button>
      <button id="openSettings" class="icon-btn" type="button" aria-label="Ayarlar ve yedekleme">⚙️</button>
    </div>

    <h1 id="pageTitle" class="page-title">Bu Hafta</h1>

    <div class="weekbar">
      <button id="prevWeek" class="round" type="button" aria-label="Önceki hafta">‹</button>
      <div class="week-title">
        <strong id="weekLabel">Bu hafta</strong>
        <span id="weekDates"></span>
      </div>
      <button id="todayWeek" class="pill" type="button">Bu hafta</button>
      <button id="nextWeek" class="round" type="button" aria-label="Sonraki hafta">›</button>
    </div>

    <div id="childStrip" class="child-strip" role="tablist" aria-label="Çocuk seçimi"></div>
  </header>

  <main id="views" class="views">
    <section id="view-homework" class="view" aria-label="Ödev takibi"></section>
    <section id="view-care" class="view" hidden aria-label="Özbakım takibi"></section>
    <section id="view-parent" class="view" hidden aria-label="Anne takibi"></section>
    <section id="view-report" class="view" hidden aria-label="Öğretmen raporu"></section>
  </main>

  <nav class="bottom-nav" role="tablist" aria-label="Bölümler">
    <button class="nav-btn active" data-view="homework" type="button" role="tab">
      <span class="nav-icon">📚</span><span class="nav-label">Ödev</span>
    </button>
    <button class="nav-btn" data-view="care" type="button" role="tab">
      <span class="nav-icon">🪥</span><span class="nav-label">Özbakım</span>
    </button>
    <button class="nav-btn" data-view="parent" type="button" role="tab">
      <span class="nav-icon">🧡</span><span class="nav-label">Anne</span>
    </button>
    <button class="nav-btn" data-view="report" type="button" role="tab">
      <span class="nav-icon">📄</span><span class="nav-label">Rapor</span>
    </button>
  </nav>
</div>

<div id="bootError" class="boot-error" hidden></div>

<template id="taskTemplate">
  <article class="task-card">
    <span class="task-icon"></span>
    <div class="task-copy">
      <h3></h3>
      <p></p>
    </div>
    <button class="check-btn" type="button">✓</button>
  </article>
</template>

<!-- Capacitor core global derlemesi: Capacitor.Plugins koleksiyonunu kurar.
     Modul kodundan once, klasik script olarak yuklenmeli. -->
<script src="js/vendor/capacitor.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
